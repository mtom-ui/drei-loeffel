<!doctype html>
<html lang="de" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>drei Löffel</title>
<meta name="theme-color" content="#F5F2EB" id="themeColor" />
<script>
  // Theme vor dem ersten Zeichnen setzen, damit Safari oben nicht kurz hell aufblitzt.
  try{
    var t = localStorage.getItem('theme');
    var d = t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.dataset.theme = d ? 'dark' : 'light';
    document.getElementById('themeColor').content = d ? '#0E1729' : '#F5F2EB';
  }catch(e){}
</script>
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="drei Löffel" />
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml" />
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png" />
<link rel="icon" href="icons/favicon-16.png" sizes="16x16" type="image/png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Gloock&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
html,body{margin:0;background:var(--bg);}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font-family:inherit;color:inherit}
button{cursor:pointer}
::-webkit-scrollbar{display:none}
[hidden]{display:none !important}

[data-theme]{--bg:#F5F2EB;--surface:#FBF9F4;--ink:#12284A;--line:rgba(18,40,74,.16);--muted:rgba(18,40,74,.72);--faint:rgba(18,40,74,.42);--seg:rgba(18,40,74,.07);--accent:#2643C8;--outer:#E7E1D5;--scrim:rgba(18,40,74,.42);color-scheme:light}
[data-theme="dark"]{--bg:#0E1729;--surface:#16213A;--ink:#F2EEE6;--line:rgba(242,238,230,.14);--muted:rgba(242,238,230,.72);--faint:rgba(242,238,230,.4);--seg:rgba(242,238,230,.09);--accent:#99B7F5;--outer:#060B15;--scrim:rgba(0,0,0,.6);color-scheme:dark}
input::placeholder,textarea::placeholder{color:var(--faint)}

#app{min-height:100dvh;display:flex;justify-content:center;align-items:flex-start;font-family:'Instrument Sans',system-ui,sans-serif;color:var(--ink);background:var(--bg)}
@media (min-width:520px){html,body,#app{background:var(--outer)}}
.phone{position:relative;width:100%;max-width:430px;height:100dvh;background:var(--bg);overflow:hidden;display:flex;flex-direction:column}
@media (min-width:520px){.phone{height:844px;margin:32px 0;border-radius:46px;box-shadow:0 40px 90px -40px rgba(18,40,74,.45),0 0 0 1px rgba(18,40,74,.14)}}
#screen{flex:1;min-height:0;display:flex;flex-direction:column}
.scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}

.serif{font-family:Gloock,serif;font-weight:400}
.kicker{font-style:italic;color:var(--accent);font-size:15px}
.muted{color:var(--muted)}
.top-pad{padding-top:max(52px,calc(env(safe-area-inset-top) + 12px))}

/* Buttons */
.circle-btn{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--ink);background:transparent;display:grid;place-items:center;flex:none;padding:0}
.circle-btn.solid{background:var(--ink);color:var(--bg);border:none;font-size:24px;line-height:1}
.float-btn{width:46px;height:46px;border-radius:50%;border:none;background:var(--bg);color:var(--ink);font-size:22px;display:grid;place-items:center;padding:0}
.pill-btn{width:100%;height:52px;border-radius:999px;border:1.5px solid var(--ink);background:transparent;font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:10px}
.cta{width:100%;height:58px;border-radius:999px;border:none;background:var(--ink);color:var(--bg);font-size:17px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:10px}
.cta:disabled{opacity:.6}
.seg{display:flex;background:var(--seg);border-radius:999px;padding:4px;gap:4px}
.seg button{flex:1;height:44px;border-radius:999px;border:none;background:transparent;font-size:15px;font-weight:600}
.seg button.on{background:var(--ink);color:var(--bg)}

/* Home */
.home-head{padding:0 22px 6px;position:relative}
.row-between{display:flex;justify-content:space-between;align-items:center}
.brand{display:flex;align-items:center;gap:10px}
.brand .serif{font-size:24px;line-height:1}
.h-xl{font-size:46px;line-height:1;letter-spacing:-.01em;margin:10px 0 0;text-wrap:balance}
.search{display:flex;align-items:center;gap:10px;height:52px;border:1.5px solid var(--ink);border-radius:999px;padding:0 18px;background:var(--surface)}
.search input{flex:1;min-width:0;border:none;outline:none;background:transparent;font-size:16px;color:var(--ink)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 22px 4px}
.chip{flex:none;display:flex;align-items:center;gap:7px;height:42px;padding:0 16px;border-radius:999px;border:1.5px solid var(--ink);background:transparent;font-size:14px;font-weight:500}
.chip.on{background:var(--ink);color:var(--bg)}
.featured{margin:22px 22px 30px;border-radius:30px;position:relative;overflow:hidden;height:230px;padding:22px;display:flex;flex-direction:column;justify-content:flex-end;gap:6px;cursor:pointer;border:none;width:calc(100% - 44px);text-align:left}
.featured .photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.featured .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(18,40,74,0) 30%,rgba(18,40,74,.72))}
.badge{position:relative;align-self:flex-start;background:#F5F2EB;color:#12284A;border-radius:999px;padding:6px 12px;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.featured .ft{position:relative;font-family:Gloock,serif;font-size:34px;line-height:1.05}
.featured .fm{position:relative;font-size:14px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;padding:22px 22px 12px}
.sec-head h2{font-size:26px;margin:0}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border-top:1px solid var(--ink);border-left:1px solid var(--ink);margin:0 22px}
.cell{border:none;border-right:1px solid var(--ink);border-bottom:1px solid var(--ink);background:transparent;padding:10px 12px 14px;display:flex;flex-direction:column;gap:4px;position:relative;min-width:0;text-align:left}
.cell:hover{background:var(--surface)}
.cell .top{display:flex;justify-content:space-between;align-items:center;height:16px}
.cell .num{font-style:italic;font-size:12px;color:var(--accent)}
.cell .art{width:74%;aspect-ratio:1;align-self:center;margin:6px 0 8px;display:block}
.cell .t{font-family:Gloock,serif;font-size:18px;line-height:1.1;text-wrap:balance;overflow-wrap:anywhere}
.cell .m{font-size:12px;color:var(--muted)}
.skel{height:230px;border-right:1px solid var(--ink);border-bottom:1px solid var(--ink);animation:pulse 1.2s ease-in-out infinite;background:var(--seg)}
@keyframes pulse{50%{opacity:.4}}
.empty{padding:40px 22px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.empty .et{font-family:Gloock,serif;font-size:24px}

/* Detail */
.hero{height:330px;position:relative;overflow:hidden;flex:none}
.hero .photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero-bar{position:absolute;top:max(54px,calc(env(safe-area-inset-top) + 12px));left:18px;right:18px;display:flex;justify-content:space-between}
.sheet-body{background:var(--bg);border-radius:30px 30px 0 0;margin-top:-30px;position:relative;padding:26px 22px 0}
.h-l{font-size:40px;line-height:1.02;margin:6px 0 10px;text-wrap:balance}
.desc{margin:0;font-size:16px;line-height:1.45;color:var(--muted);text-wrap:pretty}
.source{display:inline-flex;align-items:center;gap:6px;margin-top:12px;font-style:italic;font-size:14px;color:var(--accent);text-decoration:none}
.meta-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--ink);border-left:1px solid var(--ink);margin:22px 0}
.meta-grid div{border-right:1px solid var(--ink);border-bottom:1px solid var(--ink);padding:12px 12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.meta-grid .v{font-family:Gloock,serif;font-size:22px}
.meta-grid .l{font-style:italic;font-size:12px;color:var(--accent)}
.serv-row{display:flex;align-items:center;justify-content:space-between;padding:22px 0 8px}
.serv-row .lbl{font-family:Gloock,serif;font-size:22px}
.stepper{display:flex;align-items:center;gap:6px}
.stepper span{min-width:36px;text-align:center;font-family:Gloock,serif;font-size:26px}
.ing{display:flex;align-items:center;gap:14px;min-height:54px;padding:10px 0;border:none;border-bottom:1px solid var(--line);background:transparent;width:100%;text-align:left}
.ing .n{flex:1;font-size:16px}
.ing .a{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.ing.done .n,.ing.done .a{color:var(--faint);text-decoration:line-through}
.step{display:flex;gap:16px;padding:18px 0;border-bottom:1px solid var(--line)}
.step-num{position:relative;width:42px;height:42px;flex:none}
.step-num svg{position:absolute;inset:0;width:42px;height:42px}
.step-num span{position:absolute;inset:0;display:grid;place-items:center;font-family:Gloock,serif;font-size:18px}
.step p{margin:0;font-size:16px;line-height:1.5;text-wrap:pretty}
.step .timer{font-style:italic;font-size:13px;color:var(--accent)}
.note{margin:18px 0 0;font-style:italic;font-size:14px;color:var(--muted);line-height:1.45}
.bottom-bar{position:absolute;left:0;right:0;bottom:0;padding:14px 22px max(30px,calc(env(safe-area-inset-bottom) + 12px));background:var(--bg);border-top:1px solid var(--ink);display:flex;gap:10px;align-items:center}

/* Cook */
.cook{flex:1;min-height:0;display:flex;flex-direction:column;padding:max(54px,calc(env(safe-area-inset-top) + 12px)) 22px max(30px,calc(env(safe-area-inset-bottom) + 12px));position:relative;overflow:hidden}
.cook .ghost{border:1.5px solid currentColor;background:transparent;color:inherit}
.bars{display:flex;gap:6px;margin-top:18px}
.bars div{flex:1;height:5px;border-radius:3px;background:currentColor}
.cook-main{flex:1;display:flex;flex-direction:column;justify-content:center;gap:26px;min-height:0}
.cook-num{position:relative;width:170px;height:170px;flex:none}
.cook-num svg{position:absolute;inset:0;width:170px;height:170px}
.cook-num span{position:absolute;inset:0;display:grid;place-items:center;font-family:Gloock,serif;font-size:68px}
.cook-text{margin:0;font-family:Gloock,serif;font-size:30px;line-height:1.18;text-wrap:pretty;overflow-y:auto}
.cook-timer{align-self:flex-start;display:flex;align-items:center;gap:12px;height:54px;padding:0 22px;border-radius:999px}
.cook-timer b{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.cook-timer i{font-size:14px}
.cook-nav{display:flex;gap:10px}
.cook-nav .prev{width:58px;height:58px;flex:none;border-radius:50%;font-size:22px}
.cook-nav .next{flex:1;height:58px;border-radius:999px;border:none;font-size:17px;font-weight:600}

/* Plan */
.pad{padding-left:22px;padding-right:22px}
.week-row{display:flex;align-items:center;gap:8px}
.week-row .kicker{flex:1}
.week-row button:not(.sync){width:34px;height:34px;border-radius:50%;border:1.5px solid var(--ink);background:transparent;display:grid;place-items:center;padding:0;font-size:16px}
.today-link{border:none;background:none;padding:0;font-style:italic;font-size:14px;color:var(--accent);text-decoration:underline}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--ink);border-left:1px solid var(--ink)}
.days button{border:none;border-right:1px solid var(--ink);border-bottom:1px solid var(--ink);background:transparent;padding:8px 0 10px;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:74px;min-width:0}
.days button.on{background:var(--ink);color:var(--bg)}
.days .wd{font-size:11px;font-style:italic}
.days .dt{font-family:Gloock,serif;font-size:22px;line-height:1}
.dots{display:flex;gap:3px;height:6px;margin-top:3px}
.dots span{width:6px;height:6px;border-radius:50%}
.slot-head{display:flex;align-items:center;gap:10px;padding-bottom:10px;border-bottom:1px solid var(--ink)}
.slot-head .sl{flex:1;font-family:Gloock,serif;font-size:21px}
.slot-head .sc{font-size:13px;color:var(--muted)}
.item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.item .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;border:none;background:none;padding:0;text-align:left}
.item .it{font-family:Gloock,serif;font-size:18px;line-height:1.1}
.item .im{font-size:12px;color:var(--muted)}
.item .x{width:44px;height:44px;border:none;background:transparent;color:var(--muted);font-size:16px}
.thumb{position:relative;border-radius:16px;display:grid;place-items:center;flex:none;overflow:hidden;border:none;padding:0}
.thumb .photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.add-dish{width:100%;min-height:50px;margin-top:10px;border:1.5px dashed var(--ink);border-radius:16px;background:transparent;font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px}

/* Favoriten */
.fav-row{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--ink)}
.fav-row .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;border:none;background:none;padding:0;text-align:left}
.fav-row .ft{font-family:Gloock,serif;font-size:21px;line-height:1.1}
.fav-row .fm{font-size:13px;color:var(--muted)}

/* Tabbar */
.tabs{flex:none;display:flex;justify-content:space-around;border-top:1px solid var(--ink);background:var(--bg);padding:10px 12px max(22px,calc(env(safe-area-inset-bottom) + 6px))}
.tabs button{border:none;background:transparent;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:80px;min-height:48px}
.tabs span{font-size:12px;font-weight:600}

/* Sheet */
.sheet-wrap{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;justify-content:flex-end}
.scrim{position:absolute;inset:0;background:var(--scrim);animation:fade .2s}
.sheet{position:relative;background:var(--bg);border-radius:30px 30px 0 0;max-height:84%;display:flex;flex-direction:column;border-top:1px solid var(--ink);animation:up .28s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@keyframes fade{from{opacity:0}}
.grabber{padding:10px 0 0;display:flex;justify-content:center}
.grabber span{width:40px;height:5px;border-radius:3px;background:var(--faint)}
.sheet-head{padding:14px 22px;display:flex;flex-direction:column;gap:2px}
.sheet-head .st{font-family:Gloock,serif;font-size:28px;line-height:1.1}
.sheet-label{font-size:13px;font-weight:600;color:var(--muted)}
.day-pick{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.day-pick button{height:56px;border-radius:14px;border:1.5px solid var(--ink);background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0}
.day-pick button.on{background:var(--ink);color:var(--bg)}
.pick-list{flex:1;min-height:0;overflow-y:auto;padding:0 22px;border-top:1px solid var(--ink)}
.pick{display:flex;align-items:center;gap:12px;padding:10px 0;border:none;border-bottom:1px solid var(--line);background:none;width:100%;text-align:left}
.pick .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.pick .pt{font-family:Gloock,serif;font-size:18px;line-height:1.1}
.pick .pm{font-size:12px;color:var(--muted)}
.sheet-search{margin:0 22px 12px;height:46px}

/* Editor */
.form{padding:0 22px 140px}
.field{margin-top:18px}
.field label,.flabel{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px}
.inp{width:100%;min-height:52px;padding:14px 18px;border:1.5px solid var(--ink);border-radius:18px;background:var(--surface);font-size:16px;outline:none;color:var(--ink)}
.inp:focus{border-color:var(--accent)}
textarea.inp{resize:vertical;min-height:110px;line-height:1.5}
select.inp{appearance:none;-webkit-appearance:none}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{font-size:12px;color:var(--faint);margin-top:6px;font-style:italic}
.photo-drop{position:relative;height:190px;border:1.5px dashed var(--ink);border-radius:24px;display:grid;place-items:center;overflow:hidden;text-align:center;font-size:15px;font-weight:600;margin-top:18px}
.photo-drop img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.photo-drop input{position:absolute;inset:0;opacity:0;cursor:pointer}
.photo-drop .chg{position:absolute;right:12px;bottom:12px;background:#F5F2EB;color:#12284A;border-radius:999px;padding:6px 12px;font-size:12px;font-weight:600}
.ing-rows{display:grid;gap:8px}
.ing-row{display:grid;grid-template-columns:70px 72px 1fr 36px;gap:6px;align-items:center}
.ing-row .inp{min-height:46px;padding:10px 12px;border-radius:14px}
.ing-row .del{width:36px;height:46px;border:none;background:none;color:var(--muted);font-size:16px;padding:0}
.danger{border:none;background:none;color:#C9423A;font-size:15px;font-weight:600;padding:0 6px;flex:none}

/* Toast */
.toast{position:absolute;left:50%;top:max(16px,calc(env(safe-area-inset-top) + 6px));z-index:50;transform:translate(-50%,-20px);opacity:0;pointer-events:none;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;font-weight:600;transition:all .25s;max-width:calc(100% - 44px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.err{background:#C9423A;color:#fff}
/* Sync-Anzeige */
.sync{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px 0 8px;border-radius:999px;border:1px solid var(--line);background:transparent;font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap;flex:none}
.brand .sync{margin-left:10px}
.sync .dot{position:relative;width:8px;height:8px;border-radius:50%;background:var(--faint)}
.sync[data-state="ok"] .dot{background:#2FA56B}
.sync[data-state="ok"] .dot::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid #2FA56B;opacity:0;animation:ping 2.4s ease-out infinite}
.sync[data-state="save"] .dot,.sync[data-state="sync"] .dot{background:#E9A91F;animation:blink .9s ease-in-out infinite}
.sync[data-state="err"] .dot{background:#C9423A}
.sync[data-state="err"]{color:#C9423A;border-color:rgba(201,66,58,.4)}
@keyframes ping{0%{transform:scale(.6);opacity:.7}80%,100%{transform:scale(1.6);opacity:0}}
@keyframes blink{50%{opacity:.35}}

/* Neu-Badge */
.new-badge{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 8px;border-radius:999px;background:#FCCA59;color:#12284A;font-family:'Instrument Sans',system-ui,sans-serif;font-size:11px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;vertical-align:middle;white-space:nowrap}
.new-badge.big{height:auto;padding:6px 12px;font-size:12px}
.new-badge svg{animation:spin 6s linear infinite}

/* Suche */
.search-btn{width:100%;text-align:left;color:var(--faint);font-size:16px}
.search-top{display:flex;gap:10px;align-items:center;padding:0 22px}
.search .clear{border:none;background:var(--seg);width:28px;height:28px;border-radius:50%;font-size:12px;color:var(--muted);flex:none;padding:0}
.browse{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:0 22px}
.browse-tile{position:relative;overflow:hidden;height:96px;border:none;border-radius:22px;padding:14px;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-start;text-align:left}
.browse-tile .bt{position:relative;font-family:Gloock,serif;font-size:21px;line-height:1.05}
.browse-tile .bn{position:relative;font-size:12px;opacity:.8}
.result .why{font-size:12px;font-style:italic;color:var(--accent)}
mark{background:rgba(252,202,89,.55);color:inherit;border-radius:3px;padding:0 1px}
[data-theme="dark"] mark{background:rgba(252,202,89,.35)}

/* Einkaufsliste */
.progress{height:8px;border-radius:999px;background:var(--seg);overflow:hidden}
.progress div{height:100%;background:#2FA56B;border-radius:999px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.ing .from{font-size:12px;color:var(--muted);text-decoration:none}
.tabs button{min-width:64px}

.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
.upload-veil{position:absolute;inset:0;display:grid;place-items:center;background:rgba(18,40,74,.45);color:#F5F2EB;font-weight:600;font-size:15px;z-index:2}
.upload-veil svg{animation:spin 1.4s linear infinite}

/* ---------- Animationen ---------- */
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
@keyframes pop{0%{opacity:0;transform:scale(.6) rotate(-12deg)}60%{opacity:1;transform:scale(1.08) rotate(3deg)}100%{transform:none}}
@keyframes boing{0%{transform:scale(1)}30%{transform:scale(.72) rotate(-14deg)}60%{transform:scale(1.22) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes drift{0%,100%{transform:translate(-50%,-50%) rotate(12deg) scale(1)}50%{transform:translate(-50%,-50%) rotate(22deg) scale(1.04)}}
@keyframes sway{0%,100%{transform:rotate(10deg)}50%{transform:rotate(24deg)}}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
@keyframes slideIn{from{opacity:0;transform:translateX(28px)}}
@keyframes slideBack{from{opacity:0;transform:translateX(-28px)}}
@keyframes party{0%{transform:scale(0) rotate(-90deg)}60%{transform:scale(1.15) rotate(20deg)}100%{transform:scale(1) rotate(0)}}

@media (prefers-reduced-motion:no-preference){
  button{transition:transform .18s cubic-bezier(.34,1.56,.64,1)}
  button:active{transform:scale(.94)}
  .cell:active,.ing:active,.pick:active,.item .body:active,.fav-row .body:active{transform:scale(.98)}
  .cell .art{transition:transform .45s cubic-bezier(.34,1.56,.64,1)}
  .cell:hover .art{transform:rotate(-8deg) scale(1.04)}
  .cell:active .art{transform:rotate(14deg) scale(.9)}
  .featured > svg{animation:sway 9s ease-in-out infinite}
  .hero > svg{animation:drift 12s ease-in-out infinite}
  .empty > svg{animation:wiggle 2.4s ease-in-out infinite}

  .enter .home-head,.enter .search,.enter .chips,.enter .sec-head,.enter .sheet-body,.enter .form,.enter .week-row,.enter h1,.enter .days{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
  .enter .search{animation-delay:.05s}
  .enter .chips{animation-delay:.1s}
  .enter .featured{animation:pop .6s cubic-bezier(.2,.8,.2,1) .12s both}
  .enter .cell,.enter .fav-row,.enter .slot-block{animation:rise .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(.15s + var(--i,0) * 55ms)}
  .enter .cell .art{animation:pop .6s cubic-bezier(.34,1.56,.64,1) both;animation-delay:calc(.2s + var(--i,0) * 55ms)}
  .enter .hero > svg{animation:pop .7s cubic-bezier(.34,1.56,.64,1) both,drift 12s ease-in-out .7s infinite}
  .enter .browse-tile,.enter .result{animation:pop .5s cubic-bezier(.34,1.56,.64,1) both;animation-delay:calc(.1s + var(--i,0) * 50ms)}
  .enter .step-num{animation:pop .5s cubic-bezier(.34,1.56,.64,1) both;animation-delay:calc(var(--i,0) * 60ms)}
  .enter .cook-main{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
  .enter .dots span{animation:pop .4s cubic-bezier(.34,1.56,.64,1) both}
  .tabs .pop svg,.pop{animation:boing .5s cubic-bezier(.34,1.56,.64,1)}
  .pop-list > *{animation:rise .35s cubic-bezier(.2,.8,.2,1) both}
  .step-fwd .cook-num{animation:pop .55s cubic-bezier(.34,1.56,.64,1) both}
  .step-fwd .cook-text,.step-fwd .cook-timer{animation:slideIn .4s cubic-bezier(.2,.8,.2,1) both}
  .step-back .cook-num{animation:pop .55s cubic-bezier(.34,1.56,.64,1) both}
  .step-back .cook-text,.step-back .cook-timer{animation:slideBack .4s cubic-bezier(.2,.8,.2,1) both}
  .cook-done > svg{animation:party .8s cubic-bezier(.34,1.56,.64,1) both,spin 18s linear .8s infinite}
  .cook-timer.running b{animation:wiggle 1s ease-in-out infinite;display:inline-block}
  .ing.done .n{transition:color .25s}
}
</style>

<body>
<div id="app">
  <div class="phone">
    <div id="screen"></div>
    <div id="tabs"></div>
    <div id="sheet"></div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>
</div>

<script>
// ============================================================
// Supabase
// ============================================================
function stored(k){ try{ return localStorage.getItem(k); }catch{ return null; } }
function store(k, v){ try{ localStorage.setItem(k, v); }catch{} }
const SB_URL = stored('sb_url') || 'https://msqqtuhlastwprsrrpbz.supabase.co';
const SB_KEY = stored('sb_key') || 'sb_publishable_ZAOQrXIMdlLrbUiEqomZ4g_QFoedBIC';
// Bewusst "sb": supabase-js belegt selbst den globalen Namen "supabase".
const sb = window.supabase.createClient(SB_URL, SB_KEY);

// ============================================================
// Formen & Farben (aus der Design-Vorlage)
// ============================================================
const C = {cream:'#F5F2EB',ink:'#12284A',cobalt:'#2643C8',blue:'#99B7F5',green:'#267F53',orange:'#F5793B',pink:'#F296BD',yellow:'#FCCA59'};
const TAU = Math.PI * 2;
const pt = (r, t) => (50 + r * Math.sin(t)).toFixed(2) + ' ' + (50 - r * Math.cos(t)).toFixed(2);
const polar = (fn, n = 360) => { let d = ''; for(let i = 0; i < n; i++){ const t = i / n * TAU; d += (i ? 'L' : 'M') + pt(fn(t), t); } return d + 'Z'; };
const star = (n, ro, ri) => { let d = ''; for(let i = 0; i < n * 2; i++) d += (i ? 'L' : 'M') + pt(i % 2 ? ri : ro, i / (n * 2) * TAU); return d + 'Z'; };
const curvy = (n, ro, ri) => { let d = 'M' + pt(ro, 0); for(let i = 0; i < n; i++) d += 'Q' + pt(ri, (i + .5) / n * TAU) + ' ' + pt(ro, (i + 1) / n * TAU); return d + 'Z'; };
const A = Math.abs, P = Math.pow, cos = Math.cos;
const SH = {
  scallop: polar(t => 39 + 8 * A(cos(t * 8))),
  flower:  polar(t => 24 + 22 * P(A(cos(t * 2.5)), .6)),
  daisy:   polar(t => 14 + 33 * P(A(cos(t * 4)), 1.6)),
  burst:   star(14, 47, 36),
  star8:   star(8, 48, 17),
  star6:   star(6, 47, 27),
  sparkle: curvy(4, 48, 6),
  spiky:   curvy(10, 47, 28),
  clover:  polar(t => 28 + 19 * P(A(cos(t * 2)), .5)),
  ring:    polar(t => 40 + 7 * A(cos(t * 6))) + 'M50 28A22 22 0 1 0 50.01 28Z',
  circle:  'M50 6A44 44 0 1 1 49.99 6Z',
};
const PAIRS = [[C.orange,C.yellow],[C.yellow,C.cobalt],[C.pink,C.orange],[C.green,C.pink],[C.blue,C.green],[C.cobalt,C.yellow],[C.yellow,C.orange],[C.pink,C.ink],[C.orange,C.pink],[C.green,C.yellow]];
const SHAPES = ['scallop','daisy','burst','flower','clover','star8','ring','star6','spiky','sparkle'];
const CAT_LOOK = [['scallop',C.orange],['daisy',C.yellow],['burst',C.pink],['flower',C.green],['spiky',C.blue],['clover',C.cobalt],['star6',C.orange],['sparkle',C.pink]];
const SLOTS = [['morning','Morgens','sparkle',C.yellow],['lunch','Mittags','burst',C.orange],['dinner','Abends','circle',C.blue]];
const STEP_C = [C.yellow,C.pink,C.blue,C.orange,C.green];
const STEP_S = ['scallop','flower','burst','clover','star6','spiky'];
const WD = ['Mo','Di','Mi','Do','Fr','Sa','So'];
const WDL = ['Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag','Sonntag'];
const SOURCE = {tiktok:'TikTok', instagram:'Instagram', photo:'Foto'};
const inkOn = c => (c === C.green || c === C.cobalt || c === C.ink) ? C.cream : C.ink;
const pad = n => String(n).padStart(2, '0');

// ============================================================
// Zustand
// ============================================================
const S = {
  screen: 'home', rid: null,
  dark: stored('theme') ? stored('theme') === 'dark' : (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches),
  cat: 'Alle', q: '', sf: { time: null, fav: false, neu: false, tags: [] }, shopChecks: new Set(),
  serv: {}, tab: 'ingr', checked: {},
  favs: (() => { try{ return JSON.parse(stored('favs')) || []; }catch{ return []; } })(),
  weekOffset: 0, pday: (new Date().getDay() + 6) % 7,
  sheet: null, step: 0, left: null, running: false, flash: null,
  recipes: [], loading: true, plan: [],
};
let timerIv = null, flashT = null, toastT = null, wakeLock = null, clipId = 0;

// ============================================================
// Helfer
// ============================================================
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function safeUrl(u){
  if(!u) return '';
  try{ const x = new URL(u); return /^https?:$/.test(x.protocol) ? x.href : ''; }catch{ return ''; }
}
function hash(s){ let h = 2166136261; for(const c of String(s)){ h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
function look(r){ const h = hash(r.id); const [c, c2] = PAIRS[h % PAIRS.length]; return {c, c2, s: SHAPES[(h >>> 4) % SHAPES.length]}; }
const tagsOf = r => (r.recipe_tags || []).map(x => x.tags && x.tags.name).filter(Boolean);
const byId = id => S.recipes.find(r => r.id === id);
const numOf = r => pad(S.recipes.length - S.recipes.indexOf(r));
function metaOf(r){
  const bits = [];
  if(r.prep_time_minutes) bits.push(r.prep_time_minutes + ' Min');
  bits.push(r.servings + (r.servings === 1 ? ' Portion' : ' Portionen'));
  return bits.join(' · ');
}
function toDateStr(d){ return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
function weekDates(offset){
  const n = new Date();
  const mon = new Date(n.getFullYear(), n.getMonth(), n.getDate() - ((n.getDay() + 6) % 7) + offset * 7);
  return [0,1,2,3,4,5,6].map(i => new Date(mon.getFullYear(), mon.getMonth(), mon.getDate() + i));
}
function isoWeek(d){
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  t.setUTCDate(t.getUTCDate() + 4 - (t.getUTCDay() || 7));
  return Math.ceil(((t - Date.UTC(t.getUTCFullYear(), 0, 1)) / 864e5 + 1) / 7);
}
function half(n){
  const w = Math.floor(n), f = +(n - w).toFixed(2);
  if(f === .5) return w ? w + '½' : '½';
  return n.toLocaleString('de-DE', {maximumFractionDigits: 2});
}
function amountOf(i, serv, base){
  if(i.amount == null) return i.unit || '';
  let n = i.amount * serv / base;
  if(serv !== base){
    if(n >= 50) n = Math.round(n / 10) * 10;
    else if(n >= 10) n = Math.round(n);
    else n = Math.round(n * 2) / 2 || .5;
  }
  return half(n) + (i.unit ? ' ' + i.unit : '');
}
function parseSteps(text){
  const steps = [], notes = [];
  String(text || '').split(/\n+/).map(l => l.trim()).filter(Boolean).forEach(l => {
    if(/^(hinweis|tipp|note)\s*:/i.test(l)) notes.push(l);
    else steps.push(l.replace(/^(\d+[\.\):]|[-•*])\s*/, ''));
  });
  return {steps, notes};
}
function minutesIn(text){
  const m = text.match(/(\d+(?:[.,]\d+)?)\s*(?:[–-]\s*\d+(?:[.,]\d+)?\s*)?(min\b|min\.|minuten|std\b|std\.|stunden)/i);
  if(!m) return 0;
  const v = parseFloat(m[1].replace(',', '.'));
  return Math.round(/^s/i.test(m[2]) ? v * 60 : v);
}
function toast(msg, err){
  const t = $('toast');
  t.textContent = msg; t.classList.toggle('err', !!err); t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), err ? 4000 : 2000);
}
function fail(prefix, e){ console.error(e); toast(prefix + ': ' + (e.message || e), true); }

// ---------- SVG-Bausteine ----------
function shape(name, fill, css = '', extra = ''){
  return `<svg viewBox="0 0 100 100" style="${css}" aria-hidden="true"><path d="${SH[name]}" fill-rule="evenodd" ${extra} style="fill:${fill}"></path></svg>`;
}
function mark(on, size = 24){
  return `<svg viewBox="-6 -6 112 112" style="width:${size}px;height:${size}px;flex:none" aria-hidden="true"><path d="${on ? SH.star8 : SH.circle}" stroke-width="7" stroke-linejoin="round" style="fill:${on ? C.green : 'transparent'};stroke:var(--ink)"></path></svg>`;
}
function flower(filled, size = 24){
  return `<svg viewBox="-6 -6 112 112" style="width:${size}px;height:${size}px" aria-hidden="true"><path d="${SH.flower}" stroke-width="7" stroke-linejoin="round" style="fill:${filled ? C.pink : 'transparent'};stroke:var(--ink)"></path></svg>`;
}
// Rezept-Illustration: Form in Rezeptfarbe, mit Foto darin, falls vorhanden
function art(r, cls){
  const L = look(r), url = safeUrl(r.image_url), id = 'k' + (++clipId);
  return `<svg class="${cls}" viewBox="0 0 100 100" aria-hidden="true">
    ${url ? `<defs><clipPath id="${id}" clip-rule="evenodd"><path d="${SH[L.s]}" clip-rule="evenodd"></path></clipPath></defs>` : ''}
    <path d="${SH[L.s]}" fill-rule="evenodd" style="fill:${L.c}"></path>
    ${url ? `<image href="${esc(url)}" x="0" y="0" width="100" height="100" preserveAspectRatio="xMidYMid slice" clip-path="url(#${id})" onerror="this.remove()"></image>` : ''}
  </svg>`;
}
function thumb(r, size, radius = 16, act = ''){
  const L = look(r), url = safeUrl(r.image_url);
  return `<button class="thumb" ${act} style="width:${size}px;height:${size}px;border-radius:${radius}px;background:${L.c}" aria-label="${esc(r.title)}">
    ${shape(L.s, L.c2, `width:${Math.round(size * .73)}px;height:${Math.round(size * .73)}px`)}
    ${url ? `<img class="photo" src="${esc(url)}" alt="" loading="lazy" onerror="this.remove()" />` : ''}
  </button>`;
}

// ============================================================
// Live-Sync
// ============================================================
// Realtime-Events von Supabase (falls für die Tabellen aktiviert) + Abfrage alle
// 20 s + beim Zurückkehren in die App. Neu gezeichnet wird nur bei echten Änderungen.
const SYNC = { pending: 0, syncing: false, last: null, error: false, saved: false, live: false };
let savedT = null, refreshT = null, recipesSig = '', planSig = '';

function syncState(){
  if(!navigator.onLine) return ['off', 'Offline'];
  if(SYNC.pending) return ['save', 'Speichert…'];
  if(SYNC.error) return ['err', 'Nicht synchron'];
  if(SYNC.saved) return ['ok', 'Gespeichert'];
  if(!SYNC.last) return ['sync', 'Verbinde…'];
  return ['ok', 'Live'];
}
function syncPill(){
  const [st, label] = syncState();
  return `<button class="sync" data-act="refresh" data-state="${st}" aria-live="polite"><span class="dot"></span><span class="lbl">${label}</span></button>`;
}
function updateSync(){
  const [st, label] = syncState();
  const time = SYNC.last ? SYNC.last.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit', second: '2-digit' }) : '–';
  document.querySelectorAll('.sync').forEach(el => {
    el.dataset.state = st;
    el.querySelector('.lbl').textContent = label;
    el.title = `Zuletzt abgeglichen: ${time}${SYNC.live ? ' · Echtzeit aktiv' : ''} – tippen zum Aktualisieren`;
  });
}
async function track(work){
  SYNC.pending++; SYNC.saved = false; updateSync();
  try{ return await work(); }
  finally{
    SYNC.pending--;
    if(!SYNC.pending){
      SYNC.saved = true; clearTimeout(savedT);
      savedT = setTimeout(() => { SYNC.saved = false; updateSync(); }, 1800);
    }
    updateSync();
  }
}
function planNeeded(){ return S.screen === 'plan' || S.screen === 'shop' || !!S.sheet; }
async function refresh(){
  if(SYNC.syncing) return;
  SYNC.syncing = true; updateSync();
  await Promise.all([loadRecipes(true), planNeeded() ? loadPlan(false, true) : null]);
  SYNC.syncing = false; updateSync();
}
function scheduleRefresh(){ clearTimeout(refreshT); refreshT = setTimeout(refresh, 400); }

function startLive(){
  try{
    sb.channel('drei-loeffel-live')
      .on('postgres_changes', { event: '*', schema: 'public' }, scheduleRefresh)
      .subscribe(status => { SYNC.live = status === 'SUBSCRIBED'; updateSync(); });
  }catch(e){ console.warn('Realtime nicht verfügbar', e); }
  setInterval(() => { if(document.visibilityState === 'visible') refresh(); }, 20000);
  document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible') refresh(); });
  window.addEventListener('online', () => { updateSync(); refresh(); });
  window.addEventListener('offline', updateSync);
}

// ============================================================
// Daten
// ============================================================
async function loadRecipes(quiet){
  const { data, error } = await sb.from('recipes').select(`
      id, title, description, instructions, image_url, servings, prep_time_minutes,
      calories_per_serving, calories_source, source_type, source_url, created_at,
      ingredients ( id, name, amount, unit, note, position ),
      recipe_tags ( tags ( id, name ) )`)
    .order('created_at', { ascending: false });
  S.loading = false;
  if(error){
    SYNC.error = true; updateSync();
    if(!quiet){ render(); fail('Fehler beim Laden', error); }
    return;
  }
  SYNC.error = false; SYNC.last = new Date();
  const sig = JSON.stringify(data);
  if(quiet && sig === recipesSig){ updateSync(); return; }
  recipesSig = sig;
  S.recipes = data || [];
  S.recipes.forEach(r => (r.ingredients || []).sort((a, b) => a.position - b.position));
  S.favs = S.favs.filter(id => byId(id));
  if(!quiet && S.screen !== 'edit') S.anim = true;
  render();
}

async function loadPlan(anim, quiet){
  const d = weekDates(S.weekOffset), week = toDateStr(d[0]);
  const [plan, checks] = await Promise.all([
    sb.from('meal_plan').select('id, plan_date, meal_time, recipe_id')
      .gte('plan_date', week).lte('plan_date', toDateStr(d[6]))
      .order('created_at', { ascending: true }),
    SHOP_DB.ok ? sb.from('shopping_checks').select('item_key').eq('week_start', week) : null,
  ]);
  if(plan.error){
    SYNC.error = true; updateSync();
    if(!quiet) fail('Fehler beim Laden des Wochenplans', plan.error);
    return;
  }
  if(checks && checks.error){ SHOP_DB.ok = false; console.warn('shopping_checks fehlt – Häkchen nur lokal', checks.error); }
  const shopKeys = SHOP_DB.ok && checks ? checks.data.map(x => x.item_key) : localChecks(week);
  SYNC.error = false; SYNC.last = new Date();
  const sig = JSON.stringify([week, plan.data, shopKeys]);
  if(quiet && sig === planSig){ updateSync(); return; }
  planSig = sig;
  S.plan = (plan.data || []).filter(e => e.recipe_id && byId(e.recipe_id));
  S.shopChecks = new Set(shopKeys);
  if(anim) S.anim = true;
  render();
}
const planFor = (dateStr, meal) => S.plan.filter(e => e.plan_date === dateStr && e.meal_time === meal);

async function planAdd(dateStr, meal, recipeId){
  await track(async () => {
    const { error } = await sb.from('meal_plan').insert({ plan_date: dateStr, meal_time: meal, recipe_id: recipeId });
    if(error) return fail('Fehler', error);
    await loadPlan();
  });
}
async function planRemove(entryId){
  await track(async () => {
    const { error } = await sb.from('meal_plan').delete().eq('id', entryId);
    if(error) return fail('Fehler', error);
    await loadPlan();
  });
}

// ============================================================
// Helfer: Suche, "Neu", Einkaufsliste
// ============================================================
const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/ß/g, 'ss');
const NEW_MS = 3 * 864e5;
const isNew = r => r.created_at && Date.now() - new Date(r.created_at).getTime() < NEW_MS;
const newBadge = (cls = '') => `<span class="new-badge ${cls}">${shape('sparkle', C.ink, 'width:10px;height:10px')}Neu</span>`;

function categories(){
  const counts = {};
  S.recipes.forEach(r => tagsOf(r).forEach(t => counts[t] = (counts[t] || 0) + 1));
  return Object.keys(counts).sort((a, b) => counts[b] - counts[a] || a.localeCompare(b, 'de')).slice(0, 10);
}
function homeFiltered(){
  if(S.cat === 'Neu') return S.recipes.filter(isNew);
  return S.recipes.filter(r => S.cat === 'Alle' || tagsOf(r).includes(S.cat));
}

// Alle Suchwörter müssen irgendwo vorkommen (Titel, Tag, Zutat, Beschreibung).
function searchRecipes(){
  const tokens = norm(S.q).split(/\s+/).filter(Boolean);
  const f = S.sf;
  const res = [];
  for(const r of S.recipes){
    if(f.time && !(r.prep_time_minutes && r.prep_time_minutes <= f.time)) continue;
    if(f.fav && !S.favs.includes(r.id)) continue;
    if(f.neu && !isNew(r)) continue;
    if(f.tags.length && !f.tags.every(t => tagsOf(r).includes(t))) continue;
    let score = 0; const why = new Set(); let ok = true;
    const title = norm(r.title), tags = tagsOf(r), ings = r.ingredients || [];
    for(const t of tokens){
      let hit = false;
      if(title.includes(t)){ score += title.startsWith(t) ? 4 : 3; hit = true; }
      const tag = tags.find(x => norm(x).includes(t));
      if(tag){ score += 2; hit = true; why.add('Tag: ' + tag); }
      const ing = ings.find(i => norm(i.name).includes(t));
      if(ing){ score += 1.5; hit = true; why.add('Zutat: ' + ing.name.replace(/\s*\(.*\)/, '')); }
      if(!hit && norm(r.description).includes(t)){ score += .5; hit = true; }
      if(!hit){ ok = false; break; }
    }
    if(ok) res.push({ r, score, why: [...why].slice(0, 2) });
  }
  return res.sort((a, b) => b.score - a.score || new Date(b.r.created_at) - new Date(a.r.created_at));
}
function highlight(text){
  const tokens = norm(S.q).split(/\s+/).filter(Boolean);
  if(!tokens.length) return esc(text);
  const n = norm(text), marks = new Array(text.length).fill(false);
  tokens.forEach(t => { let i = n.indexOf(t); while(i >= 0){ for(let k = i; k < i + t.length; k++) marks[k] = true; i = n.indexOf(t, i + 1); } });
  let out = '', open = false;
  [...text].forEach((ch, i) => {
    if(marks[i] && !open){ out += '<mark>'; open = true; }
    if(!marks[i] && open){ out += '</mark>'; open = false; }
    out += esc(ch);
  });
  return out + (open ? '</mark>' : '');
}

const SHOP_CATS = [
  { key: 'vorrat',  label: 'Vorrat & Konserven', sh: 'daisy',   c: C.orange, re: /dose|passiert|tomatenmark|bruhe|fond|nudel|pasta|spaghetti|penne|fusilli|reis\b|risotto|linsen|bohnen|kichererbsen|couscous|quinoa|bulgur|gnocchi|kokosmilch|sauergurke|gewurzgurke|mais\b|tortilla|wraps|panko|semmelbrosel/ },

  { key: 'backen',  label: 'Backen & Nüsse',       sh: 'scallop', c: C.yellow, re: /mehl\b|zucker|hefe|backpulver|natron|vanill|starke|haferflocken|kakao|schokolade|sesam|nusse|nuss\b|mandel|walnuss|haselnuss|pinienkern|rosine|brot|brotchen|toast/ },
  { key: 'gemuese', label: 'Obst, Gemüse & Kräuter', sh: 'flower', c: C.green, re: /tomat|zwiebel|schalott|knoblauch|kartoffel|karott|mohre|paprika|zucchini|gurke|salat|spinat|kohl|brokkoli|lauch|porree|sellerie|pilz|champignon|avocado|zitrone|limette|apfel|birne|banane|beere|orange|ingwer|krauter|petersilie|basilikum|schnittlauch|dill|koriander|minze|kurbis|aubergine|rucola|chili|rote bete|fenchel|spargel|erbsen|thymian|rosmarin|salbei|mango|ananas|traube/ },
];
const OTHER_CAT = { key: 'sonst', label: 'Sonstiges', sh: 'clover', c: '#9AA3B5' };
function shopCat(name){ const n = norm(name); return SHOP_CATS.find(c => c.re.test(n)) || OTHER_CAT; }
const baseName = n => n.replace(/\s*\([^)]*\)/g, '').trim();
function unitNorm(amount, unit){
  const u = norm(unit || '').replace(/\.$/, '');
  if(amount != null && u === 'kg') return [amount * 1000, 'g'];
  if(amount != null && (u === 'l' || u === 'liter')) return [amount * 1000, 'ml'];
  return [amount, unit || ''];
}
function unitPretty(amount, unit){
  if(amount == null) return unit || '';
  if(unit === 'g' && amount >= 1000) return half(Math.round(amount / 100) / 10) + ' kg';
  if(unit === 'ml' && amount >= 1000) return half(Math.round(amount / 100) / 10) + ' l';
  return half(Math.round(amount * 100) / 100) + (unit ? ' ' + unit : '');
}
function shoppingList(){
  const items = new Map();
  for(const e of S.plan){
    const r = byId(e.recipe_id);
    if(!r) continue;
    for(const i of r.ingredients || []){
      const [amt, unit] = unitNorm(i.amount, i.unit);
      const key = norm(baseName(i.name)) + '|' + (amt == null ? '' : norm(unit));
      const it = items.get(key) || { key, name: baseName(i.name) || i.name, raw: i.name, unit: amt == null ? '' : unit, amount: null, loose: false, from: new Set() };
      if(amt == null) it.loose = true; else it.amount = (it.amount || 0) + amt;
      it.from.add(r.title);
      items.set(key, it);
    }
  }
  // "Salz" ohne Menge in "Salz 1 TL" einfalten, statt es doppelt zu listen.
  for(const [key, it] of items){
    if(it.amount != null) continue;
    const twin = [...items.values()].find(x => x !== it && x.amount != null && norm(x.name) === norm(it.name));
    if(twin){ twin.loose = true; it.from.forEach(f => twin.from.add(f)); items.delete(key); }
  }
  const groups = [...SHOP_CATS, OTHER_CAT].map(c => ({ ...c, items: [] }));
  for(const it of items.values()){
    const g = groups.find(x => x.key === shopCat(it.raw).key);
    g.items.push(it);
  }
  groups.forEach(g => g.items.sort((a, b) => (S.shopChecks.has(a.key) - S.shopChecks.has(b.key)) || a.name.localeCompare(b.name, 'de')));
  return groups.filter(g => g.items.length);
}
function localChecks(week){ try{ return JSON.parse(stored('shop:' + week)) || []; }catch{ return []; } }
async function toggleShop(key){
  const week = toDateStr(weekDates(S.weekOffset)[0]);
  const on = !S.shopChecks.has(key);
  on ? S.shopChecks.add(key) : S.shopChecks.delete(key);
  S.pop = 'shop:' + key;
  render();
  if(!SHOP_DB.ok){ store('shop:' + week, JSON.stringify([...S.shopChecks])); return; }
  await track(async () => {
    const q = on
      ? sb.from('shopping_checks').upsert({ week_start: week, item_key: key })
      : sb.from('shopping_checks').delete().eq('week_start', week).eq('item_key', key);
    const { error } = await q;
    if(error){
      SHOP_DB.ok = false;
      store('shop:' + week, JSON.stringify([...S.shopChecks]));
      console.warn('shopping_checks nicht verfügbar – speichere lokal', error);
    }
  });
}
async function resetShop(){
  const week = toDateStr(weekDates(S.weekOffset)[0]);
  S.shopChecks = new Set(); render();
  if(!SHOP_DB.ok){ store('shop:' + week, '[]'); return; }
  await track(() => sb.from('shopping_checks').delete().eq('week_start', week));
}
async function shareShop(){
  const lines = [];
  shoppingList().forEach(g => {
    const open = g.items.filter(it => !S.shopChecks.has(it.key));
    if(!open.length) return;
    lines.push(g.label.toUpperCase());
    open.forEach(it => lines.push(`• ${it.name}${it.amount != null ? ' – ' + unitPretty(it.amount, it.unit) : ''}`));
    lines.push('');
  });
  const text = lines.join('\n').trim() || 'Alles erledigt 🎉';
  const title = `Einkaufsliste KW ${isoWeek(weekDates(S.weekOffset)[0])}`;
  try{
    if(navigator.share){ await navigator.share({ title, text }); return; }
    await navigator.clipboard.writeText(title + '\n\n' + text);
    toast('Liste kopiert');
  }catch(e){ if(e.name !== 'AbortError') toast('Teilen nicht möglich', true); }
}

function cookHTML(){
  const r = byId(S.rid);
  if(!r){ S.screen = 'home'; return homeHTML(); }
  const L = look(r);
  const { steps } = parseSteps(r.instructions);
  const n = steps.length, step = Math.min(S.step, n), cur = steps[step] || '';
  const c2 = L.c2 === L.c ? C.cream : L.c2;
  const ink = inkOn(L.c), mins = minutesIn(cur);
  let timerLabel = '', timerAction = '';
  if(mins){
    const left = S.left == null ? mins * 60 : S.left;
    timerLabel = Math.floor(left / 60) + ':' + pad(left % 60);
    timerAction = S.left == null ? 'Timer starten' : S.running ? 'Pause' : left === 0 ? 'Zeit ist um · neu' : 'Weiter';
  }
  return `<div class="cook${S.pop === 'fwd' ? ' step-fwd' : S.pop === 'back' ? ' step-back' : ''}" style="background:${L.c};color:${ink}">
    <div class="row-between" style="gap:12px">
      <button class="circle-btn ghost" data-act="closeCook" style="width:46px;height:46px;font-size:18px" aria-label="Schließen">✕</button>
      <span style="font-style:italic;font-size:15px;text-align:center;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(r.title)}</span>
      <span style="width:46px;text-align:right;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums">${Math.min(step + 1, n)}/${n}</span>
    </div>
    <div class="bars">${steps.map((_, i) => `<div style="opacity:${i <= step ? 1 : .25}"></div>`).join('')}</div>
    ${step < n ? `
      <div class="cook-main">
        <div class="cook-num">${shape(STEP_S[step % STEP_S.length], c2)}<span style="color:${inkOn(c2)}">${step + 1}</span></div>
        <p class="cook-text">${esc(cur)}</p>
        ${mins ? `<button class="cook-timer ghost${S.running ? ' running' : ''}" data-act="timer"><b>${timerLabel}</b><i>${timerAction}</i></button>` : ''}
      </div>
      <div class="cook-nav">
        <button class="prev ghost" data-act="prev" style="opacity:${step > 0 ? 1 : .35}" aria-label="Zurück">←</button>
        <button class="next" data-act="next" style="background:${ink};color:${L.c}">${step === n - 1 ? 'Fertig' : 'Nächster Schritt'}</button>
      </div>
    ` : `
      <div class="cook-main cook-done" style="align-items:center;text-align:center;gap:18px">
        ${shape('burst', c2, 'width:200px;height:200px')}
        <div class="serif" style="font-size:44px;line-height:1">Guten Appetit!</div>
        <div style="font-size:16px">${esc(r.title)} ist fertig.</div>
      </div>
      <button class="next" data-act="closeCook" style="height:58px;border-radius:999px;border:none;font-size:17px;font-weight:600;background:${ink};color:${L.c}">Zurück zum Rezept</button>
    `}
  </div>`;
}

function planHTML(){
  const dates = weekDates(S.weekOffset);
  const todayStr = toDateStr(new Date());
  const total = S.plan.length;
  const days = dates.map((d, i) => {
    const ds = toDateStr(d), on = i === S.pday;
    const dots = SLOTS.filter(([k]) => planFor(ds, k).length).map(sl => `<span style="background:${sl[3]}"></span>`).join('');
    return `<button class="${on ? 'on' : ''}${on && S.pop === 'day' ? ' pop' : ''}" data-act="day" data-i="${i}">
      <span class="wd">${ds === todayStr ? 'heute' : WD[i]}</span><span class="dt">${d.getDate()}</span><div class="dots">${dots}</div>
    </button>`;
  }).join('');
  const sel = dates[S.pday], selStr = toDateStr(sel);
  const slots = SLOTS.map(([k, label, sh, c], si) => {
    const entries = planFor(selStr, k);
    const items = entries.map(e => {
      const r = byId(e.recipe_id);
      return `<div class="item">
        ${thumb(r, 52, 16, `data-act="open" data-id="${esc(r.id)}"`)}
        <button class="body" data-act="open" data-id="${esc(r.id)}"><span class="it">${esc(r.title)}</span><span class="im">${esc(metaOf(r))}</span></button>
        <button class="x" data-act="planRemove" data-id="${esc(e.id)}" aria-label="Entfernen">✕</button>
      </div>`;
    }).join('');
    return `<div class="slot-block${S.pop === 'day' ? ' pop-list' : ''}" style="margin-top:20px;--i:${si}">
      <div class="slot-head">${shape(sh, c, 'width:22px;height:22px;flex:none')}<span class="sl">${label}</span>
        <span class="sc">${entries.length ? entries.length + (entries.length === 1 ? ' Gericht' : ' Gerichte') : ''}</span></div>
      ${items}
      <button class="add-dish" data-act="pick" data-v="${k}"><span style="font-size:20px;line-height:1">+</span>Gericht hinzufügen</button>
    </div>`;
  }).join('');
  const rel = S.weekOffset === 0 ? '' : S.weekOffset === 1 ? 'Nächste Woche · ' : S.weekOffset === -1 ? 'Letzte Woche · ' : '';
  return `<div class="scroll top-pad pad" data-scroll style="padding-bottom:28px;padding-top:max(58px,calc(env(safe-area-inset-top) + 16px))">
    <div class="week-row">
      <span class="kicker">${rel}KW ${isoWeek(dates[0])} · ${total} ${total === 1 ? 'Gericht' : 'Gerichte'} geplant</span>
      ${syncPill()}
      <button data-act="week" data-v="-1" aria-label="Vorherige Woche">‹</button>
      <button data-act="week" data-v="1" aria-label="Nächste Woche">›</button>
    </div>
    <div class="row-between" style="align-items:flex-end;margin:8px 0 18px">
      <h1 class="serif" style="font-size:46px;line-height:1;margin:0">Wochenplan</h1>
      ${S.weekOffset !== 0 ? '<button class="today-link" data-act="week" data-v="0">Heute</button>' : ''}
    </div>
    <div class="days">${days}</div>
    ${total ? `<button class="pill-btn" data-act="go" data-v="shop" style="margin-top:16px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/><path d="M2 3h3l2.6 12.4a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.5L21 8H6"/></svg>Einkaufsliste für diese Woche</button>` : ''}
    <div class="row-between" style="align-items:baseline;margin:26px 0 0">
      <h2 class="serif" style="font-size:26px;margin:0">${WDL[S.pday]}, ${sel.getDate()}.</h2>
      <span class="kicker" style="font-size:14px">${selStr === todayStr ? 'Heute' : ''}</span>
    </div>
    ${slots}
  </div>`;
}

function sheetHTML(){
  const sh = S.sheet;
  if(!sh) return '';
  const dates = weekDates(S.weekOffset);
  const d = dates[sh.day], ds = toDateStr(d);
  const slot = SLOTS.find(x => x[0] === sh.slot);
  let inner = '';
  if(sh.mode === 'pick'){
    const q = (sh.q || '').trim().toLowerCase();
    const entries = planFor(ds, sh.slot);
    const list = S.recipes.filter(r => !q || r.title.toLowerCase().includes(q));
    inner = `
      <div class="sheet-head"><span class="kicker" style="font-size:14px">${WDL[sh.day]}, ${d.getDate()}.</span><span class="st">${slot[1]} planen</span></div>
      <label class="search sheet-search">${shape('star8', 'var(--accent)', 'width:16px;height:16px;flex:none')}<input id="pickQ" type="search" value="${esc(sh.q || '')}" placeholder="Suchen" autocomplete="off" /></label>
      <div class="pick-list" data-sheet-scroll>
        ${list.map(r => {
          const on = entries.some(e => e.recipe_id === r.id);
          return `<button class="pick" data-act="pickToggle" data-id="${esc(r.id)}">
            ${thumb(r, 48, 14).replace('<button', '<span').replace(/<\/button>\s*$/, '</span>')}
            <span class="body"><span class="pt">${esc(r.title)}</span><span class="pm">${esc(metaOf(r))}</span></span>
            ${S.pop === 'pick:' + r.id ? `<span class="pop" style="display:grid">${mark(on, 26)}</span>` : mark(on, 26)}
          </button>`;
        }).join('') || `<p class="muted" style="text-align:center;padding:24px 0">${S.recipes.length ? 'Nichts gefunden.' : 'Noch keine Rezepte.'}</p>`}
      </div>
      <div style="padding:16px 22px max(30px,calc(env(safe-area-inset-bottom) + 12px))"><button class="cta" data-act="sheetClose" style="height:56px;font-size:16px">${entries.length ? `Fertig · ${entries.length} ${entries.length === 1 ? 'Gericht' : 'Gerichte'}` : 'Fertig'}</button></div>`;
  } else {
    const r = byId(S.rid);
    const already = planFor(ds, sh.slot).some(e => e.recipe_id === r.id);
    inner = `
      <div class="sheet-head"><span class="kicker" style="font-size:14px">${esc(r.title)}</span><span class="st">In den Wochenplan</span></div>
      <div style="padding:0 22px 6px;display:flex;flex-direction:column;gap:10px">
        <span class="sheet-label">Tag${S.weekOffset ? ` · KW ${isoWeek(dates[0])}` : ''}</span>
        <div class="day-pick">${dates.map((x, i) => `<button class="${i === sh.day ? 'on' : ''}${i === sh.day && S.pop === 'sheet' ? ' pop' : ''}" data-act="sheetDay" data-i="${i}"><span style="font-size:11px;font-style:italic">${WD[i]}</span><span class="serif" style="font-size:18px;line-height:1">${x.getDate()}</span></button>`).join('')}</div>
        <span class="sheet-label" style="margin-top:8px">Mahlzeit</span>
        <div class="seg">${SLOTS.map(([k, label]) => `<button class="${k === sh.slot ? 'on' : ''}" data-act="sheetSlot" data-v="${k}" style="font-size:14px">${label}</button>`).join('')}</div>
      </div>
      <div style="padding:16px 22px max(30px,calc(env(safe-area-inset-bottom) + 12px))"><button class="cta" data-act="assignConfirm" style="height:56px;font-size:16px">${already ? 'Schon geplant · schließen' : `Hinzufügen · ${WD[sh.day]}, ${slot[1]}`}</button></div>`;
  }
  return `<div class="sheet-wrap"><div class="scrim" data-act="sheetClose"></div><div class="sheet" role="dialog" aria-modal="true"><div class="grabber"><span></span></div>${inner}</div></div>`;
}

function render(){
  clipId = 0;
  document.documentElement.dataset.theme = S.dark ? 'dark' : 'light';
  $('themeColor').content = S.screen === 'cook' && byId(S.rid) ? look(byId(S.rid)).c : (S.dark ? '#0E1729' : '#F5F2EB');

  const scr = $('screen');
  const key = S.screen + ':' + (S.rid || '');
  const sc = scr.querySelector('[data-scroll]');
  const keep = scr.dataset.key === key && sc ? sc.scrollTop : 0;
  if(S.screen === 'edit' && scr.dataset.key === key) return;
  const focused = document.activeElement && document.activeElement.id === 'sq' ? document.activeElement : null;
  const selPos = focused ? focused.selectionStart : 0;
  const entering = scr.dataset.key !== key || S.anim;
  const html = { home: homeHTML, detail: detailHTML, cook: cookHTML, plan: planHTML, fav: favHTML, edit: editHTML, search: searchHTML, shop: shopHTML }[S.screen]();
  scr.innerHTML = html;
  scr.dataset.key = S.screen + ':' + (S.rid || '');
  if(entering && scr.firstElementChild) scr.firstElementChild.classList.add('enter');
  if(focused && $('sq')){ $('sq').focus({ preventScroll: true }); $('sq').setSelectionRange(selPos, selPos); }
  const sc2 = scr.querySelector('[data-scroll]');
  if(sc2) sc2.scrollTop = keep;

  $('tabs').innerHTML = ['home', 'plan', 'shop', 'fav'].includes(S.screen) ? tabsHTML() : '';
  renderSheet();
  S.pop = null; S.anim = false; S.tabPop = false;
}
function renderSheet(){
  const el = $('sheet');
  const list = el.querySelector('[data-sheet-scroll]');
  const keep = list ? list.scrollTop : 0;
  const hadFocus = document.activeElement && document.activeElement.id === 'pickQ';
  const pos = hadFocus ? document.activeElement.selectionStart : 0;
  el.innerHTML = sheetHTML();
  const list2 = el.querySelector('[data-sheet-scroll]');
  if(list2) list2.scrollTop = keep;
  if(hadFocus){ const q = $('pickQ'); q.focus(); q.setSelectionRange(pos, pos); }
  S.pop = null;
}
function renderSearchBody(){
  const el = $('searchBody');
  if(el){ clipId = 1000; el.innerHTML = searchBodyHTML(); }
  const clr = document.querySelector('.search-top .clear');
  if(clr) clr.hidden = !S.q;
}

// ============================================================
// Aktionen
// ============================================================
function stopTimer(){ clearInterval(timerIv); timerIv = null; S.left = null; S.running = false; }
function go(screen, extra){
  if(S.screen === 'cook' && screen !== 'cook') releaseWake();
  S.tabPop = S.screen !== screen;
  Object.assign(S, { screen, sheet: null }, extra || {});
  const sc = $('screen').querySelector('[data-scroll]');
  $('screen').dataset.key = '';
  if(sc) sc.scrollTop = 0;
  render();
  if(screen === 'plan' || screen === 'shop') loadPlan(true);
}
function openRecipe(id){ stopTimer(); go('detail', { rid: id, tab: 'ingr', flash: null }); }
function toggleFav(id){
  S.favs = S.favs.includes(id) ? S.favs.filter(x => x !== id) : [id, ...S.favs];
  store('favs', JSON.stringify(S.favs));
  S.pop = 'fav';
  render();
}
async function requestWake(){ try{ wakeLock = await navigator.wakeLock?.request('screen'); }catch{} }
function releaseWake(){ try{ wakeLock?.release(); }catch{} wakeLock = null; }

// ---------- Haptik & Ton ----------
// iOS Safari kennt navigator.vibrate nicht. Seit iOS 18 löst das Umschalten eines
// <input switch> aber ein haptisches Tippen aus – das nutzen wir unsichtbar.
const hapticSwitch = (() => {
  const label = document.createElement('label');
  label.className = 'vh'; label.setAttribute('aria-hidden', 'true');
  const input = document.createElement('input');
  input.type = 'checkbox'; input.setAttribute('switch', ''); input.tabIndex = -1;
  label.appendChild(input); document.body.appendChild(label);
  return label;
})();
function haptic(){
  try{
    if(navigator.vibrate) navigator.vibrate(12);
    else hapticSwitch.click();
  }catch{}
}
let audioCtx = null;
function unlockAudio(){
  try{ audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); audioCtx.resume(); }catch{}
}
function chime(){
  if(!audioCtx) return;
  const t0 = audioCtx.currentTime;
  [[880, 0], [1175, .18], [1568, .36], [1175, .9], [1568, 1.08], [2093, 1.26]].forEach(([f, dt]) => {
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = 'sine'; o.frequency.value = f;
    g.gain.setValueAtTime(0, t0 + dt);
    g.gain.linearRampToValueAtTime(.25, t0 + dt + .02);
    g.gain.exponentialRampToValueAtTime(.001, t0 + dt + .5);
    o.connect(g).connect(audioCtx.destination);
    o.start(t0 + dt); o.stop(t0 + dt + .55);
  });
}

function tick(){
  S.left = (S.left || 0) - 1;
  if(S.left <= 0){
    S.left = 0; S.running = false; clearInterval(timerIv); timerIv = null;
    chime();
    try{ navigator.vibrate?.([300, 150, 300]); }catch{}
    toast('⏰ Zeit ist um!');
  }
  render();
}
function timerToggle(){
  unlockAudio();
  if(S.running){ clearInterval(timerIv); timerIv = null; S.running = false; return render(); }
  const r = byId(S.rid), { steps } = parseSteps(r.instructions);
  const mins = minutesIn(steps[S.step] || '');
  if(S.left == null || S.left <= 0) S.left = mins * 60;
  S.running = true; clearInterval(timerIv); timerIv = setInterval(tick, 1000);
  render();
}

// ---------- Editor ----------
function openEditor(id){
  go('edit', { rid: id || null });
  const r = id ? byId(id) : null;
  const rows = $('ingRows');
  rows.innerHTML = (r && r.ingredients && r.ingredients.length ? r.ingredients : [null, null, null]).map(ingRowHTML).join('');
}
function setPhoto(url){
  const u = safeUrl(url);
  $('photoPreview').hidden = !u; $('photoChg').hidden = !u; $('photoHint').hidden = !!u;
  if(u) $('photoPreview').src = u; else $('photoPreview').removeAttribute('src');
}
// Handyfotos (oft 3–8 MB) vor dem Upload auf max. 1600 px / JPEG verkleinern.
async function shrinkImage(file){
  try{
    const bmp = await createImageBitmap(file, { imageOrientation: 'from-image' });
    const scale = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas');
    c.width = Math.round(bmp.width * scale); c.height = Math.round(bmp.height * scale);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    bmp.close?.();
    const blob = await new Promise(res => c.toBlob(res, 'image/jpeg', .84));
    return blob && blob.size < file.size ? blob : file;
  }catch{
    return file;
  }
}
async function storePhoto(file){
  const img = await shrinkImage(file);
  const ext = img.type === 'image/jpeg' ? 'jpg' : ((file.name.split('.').pop() || 'jpg').toLowerCase());
  const path = `${Date.now()}-${Math.random().toString(36).slice(2)}.${ext}`;
  const { error } = await sb.storage.from('recipe-photos').upload(path, img, { contentType: img.type || 'image/jpeg' });
  if(error) throw error;
  return sb.storage.from('recipe-photos').getPublicUrl(path).data.publicUrl;
}
async function uploadPhoto(file){
  const st = $('uploadStatus'), drop = $('photoDrop');
  st.textContent = 'Lade hoch…';
  drop.insertAdjacentHTML('beforeend', `<div class="upload-veil">${shape('sparkle', C.yellow, 'width:40px;height:40px')}</div>`);
  try{
    const url = await storePhoto(file);
    $('fImage').value = url; setPhoto(url);
    st.textContent = 'Foto hochgeladen ✓';
    haptic();
  }catch(e){
    st.textContent = '';
    fail('Fehler beim Hochladen', e);
  }finally{
    drop.querySelector('.upload-veil')?.remove();
  }
}
async function uploadHeroPhoto(file){
  const id = S.rid;
  S.uploading = true; render();
  try{
    const url = await storePhoto(file);
    const { error } = await sb.from('recipes').update({ image_url: url }).eq('id', id);
    if(error) throw error;
    const r = byId(id); if(r) r.image_url = url;
    toast('Foto gespeichert');
    haptic();
  }catch(e){
    fail('Fehler beim Hochladen', e);
  }finally{
    S.uploading = false; S.anim = true; render();
  }
}
async function saveRecipe(){
  const title = $('fTitle').value.trim();
  if(!title){ $('fTitle').focus(); return toast('Bitte einen Titel eingeben', true); }
  const btn = $('saveBtn'); btn.disabled = true; btn.textContent = 'Speichere…';
  const editingId = S.rid;
  try{
    const existing = editingId ? byId(editingId) : null;
    const payload = {
      title,
      description: $('fDesc').value.trim() || null,
      servings: parseInt($('fServ').value) || 4,
      prep_time_minutes: $('fTime').value ? parseInt($('fTime').value) : null,
      calories_per_serving: $('fKcal').value ? parseFloat($('fKcal').value) : null,
      calories_source: $('fKcalSrc').value,
      image_url: $('fImage').value.trim() || null,
      instructions: $('fSteps').value.trim() || null,
      source_type: existing ? existing.source_type || 'manual' : 'manual',
    };
    let id = editingId;
    if(id){
      const { error } = await sb.from('recipes').update(payload).eq('id', id);
      if(error) throw error;
      await sb.from('ingredients').delete().eq('recipe_id', id);
      await sb.from('recipe_tags').delete().eq('recipe_id', id);
    } else {
      const { data, error } = await sb.from('recipes').insert(payload).select().single();
      if(error) throw error;
      id = data.id;
    }
    const ings = [...document.querySelectorAll('#ingRows .ing-row')].map((row, idx) => {
      const name = row.querySelector('.name').value.trim();
      if(!name) return null;
      const a = row.querySelector('.amount').value;
      return { recipe_id: id, name, amount: a ? parseFloat(a) : null, unit: row.querySelector('.unit').value.trim() || null, position: idx };
    }).filter(Boolean);
    if(ings.length){ const { error } = await sb.from('ingredients').insert(ings); if(error) throw error; }
    for(const name of [...new Set($('fTags').value.split(',').map(t => t.trim()).filter(Boolean))]){
      let { data: tag } = await sb.from('tags').select('id').eq('name', name).maybeSingle();
      if(!tag){
        const { data: created, error } = await sb.from('tags').insert({ name }).select().single();
        if(error){ console.error(error); continue; }
        tag = created;
      }
      await sb.from('recipe_tags').insert({ recipe_id: id, tag_id: tag.id });
    }
    await loadRecipes();
    toast('Gespeichert');
    openRecipe(id);
  }catch(e){
    fail('Fehler beim Speichern', e);
    btn.disabled = false; btn.textContent = 'Speichern';
  }
}
async function deleteRecipe(){
  if(!S.rid) return;
  const { error } = await sb.from('recipes').delete().eq('id', S.rid);
  if(error) return fail('Fehler beim Löschen', error);
  S.favs = S.favs.filter(x => x !== S.rid); store('favs', JSON.stringify(S.favs));
  toast('Rezept gelöscht');
  go('home', { rid: null });
  loadRecipes();
}

// ============================================================
// Events
// ============================================================
const HAPTIC = new Set(['shopCheck','sfTime','sfFav','sfNew','sfTag','sqSet','refresh','theme','new','cat','fav','tab','serv','check','cook','prev','next','timer','week','day','pick','pickToggle','assign','sheetDay','sheetSlot','assignConfirm','planRemove','go','save','delete','addIng','delIng']);
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]');
  if(!el) return;
  const act = el.dataset.act, v = el.dataset.v, id = el.dataset.id;
  if(HAPTIC.has(act)) haptic();
  switch(act){
    case 'theme': S.dark = !S.dark; store('theme', S.dark ? 'dark' : 'light'); S.pop = 'theme'; render(); break;
    case 'new': openEditor(); break;
    case 'edit': openEditor(id); break;
    case 'closeEdit': S.rid ? openRecipe(S.rid) : go('home'); break;
    case 'cat': S.cat = v; render(); break;
    case 'open': S.back = null; openRecipe(id); break;
    case 'home': stopTimer(); if(S.screen === 'detail' && S.back === 'search'){ S.back = null; go('search'); } else { S.back = null; go('home'); } break;
    case 'go': go(v); break;
    case 'refresh': refresh(); break;
    case 'search': go('search'); setTimeout(() => $('sq')?.focus(), 60); break;
    case 'sqClear': S.q = ''; $('sq').value = ''; $('sq').focus(); renderSearchBody(); break;
    case 'sqSet': S.q = v; $('sq').value = v; renderSearchBody(); break;
    case 'recentClear': store('recent', '[]'); renderSearchBody(); break;
    case 'sfTime': S.sf.time = S.sf.time === Number(v) ? null : Number(v); render(); break;
    case 'sfFav': S.sf.fav = !S.sf.fav; render(); break;
    case 'sfNew': S.sf.neu = !S.sf.neu; render(); break;
    case 'sfTag': { const t = S.sf.tags; S.sf.tags = t.includes(v) ? t.filter(x => x !== v) : [...t, v]; if(S.screen !== 'search') go('search'); else render(); break; }
    case 'openFromSearch': rememberSearch(); S.back = 'search'; openRecipe(id); break;
    case 'shopCheck': toggleShop(el.dataset.k); break;
    case 'shopReset': resetShop(); break;
    case 'shopShare': shareShop(); break;
    case 'fav': toggleFav(id); break;
    case 'tab': S.tab = v; render(); break;
    case 'serv': { const r = byId(S.rid); const cur = S.serv[r.id] ?? r.servings; S.serv[r.id] = Math.min(24, Math.max(1, cur + Number(v))); S.pop = 'serv'; render(); break; }
    case 'check': S.checked[el.dataset.k] = !S.checked[el.dataset.k]; S.pop = 'ing:' + el.dataset.k; render(); break;
    case 'cook': stopTimer(); go('cook', { step: 0 }); requestWake(); break;
    case 'closeCook': stopTimer(); go('detail'); break;
    case 'prev': if(S.step > 0){ stopTimer(); S.step--; S.pop = 'back'; render(); } break;
    case 'next': stopTimer(); S.step++; S.pop = 'fwd'; render(); break;
    case 'timer': timerToggle(); break;
    case 'week': S.weekOffset = v === '0' ? 0 : S.weekOffset + Number(v); if(v === '0') S.pday = (new Date().getDay() + 6) % 7; render(); loadPlan(true); break;
    case 'day': S.pday = Number(el.dataset.i); S.pop = 'day'; render(); break;
    case 'planRemove': planRemove(id); break;
    case 'pick': S.sheet = { mode: 'pick', day: S.pday, slot: v, q: '' }; renderSheet(); break;
    case 'pickToggle': {
      const ds = toDateStr(weekDates(S.weekOffset)[S.sheet.day]);
      const hit = planFor(ds, S.sheet.slot).find(x => x.recipe_id === id);
      S.pop = 'pick:' + id;
      hit ? await planRemove(hit.id) : await planAdd(ds, S.sheet.slot, id);
      break;
    }
    case 'assign': S.sheet = { mode: 'assign', day: S.weekOffset === 0 ? (new Date().getDay() + 6) % 7 : 0, slot: 'dinner' }; await loadPlan(); break;
    case 'sheetDay': S.sheet.day = Number(el.dataset.i); S.pop = 'sheet'; renderSheet(); break;
    case 'sheetSlot': S.sheet.slot = v; renderSheet(); break;
    case 'assignConfirm': {
      const sh = S.sheet, ds = toDateStr(weekDates(S.weekOffset)[sh.day]);
      const slotLabel = SLOTS.find(x => x[0] === sh.slot)[1];
      if(!planFor(ds, sh.slot).some(x => x.recipe_id === S.rid)) await planAdd(ds, sh.slot, S.rid);
      S.sheet = null; S.flash = WD[sh.day] + ' · ' + slotLabel; S.pop = 'plan'; render();
      clearTimeout(flashT); flashT = setTimeout(() => { S.flash = null; if(S.screen === 'detail') render(); }, 2000);
      break;
    }
    case 'sheetClose': S.sheet = null; renderSheet(); if(S.screen === 'plan') render(); break;
    case 'addIng': { $('ingRows').insertAdjacentHTML('beforeend', ingRowHTML()); $('ingRows').lastElementChild.querySelector('.amount').focus(); break; }
    case 'delIng': el.closest('.ing-row').remove(); break;
    case 'save': track(saveRecipe); break;
    case 'delete': if(confirm('Rezept wirklich löschen?')) track(deleteRecipe); break;
  }
});
document.addEventListener('input', e => {
  if(e.target.id === 'fImage') setPhoto(e.target.value.trim());
  if(e.target.id === 'sq'){ S.q = e.target.value; renderSearchBody(); }
  if(e.target.id === 'pickQ'){ S.sheet.q = e.target.value; renderSheet(); }
});
document.addEventListener('change', e => {
  const f = e.target.files && e.target.files[0];
  if(!f) return;
  if(e.target.id === 'fFile') track(() => uploadPhoto(f));
  if(e.target.id === 'heroFile') track(() => uploadHeroPhoto(f));
  e.target.value = '';
});
document.addEventListener('keydown', e => {
  if(e.key === 'Enter' && e.target.id === 'sq'){ rememberSearch(); e.target.blur(); }
  if(e.key === 'Escape' && S.sheet){ S.sheet = null; renderSheet(); }
});
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'visible' && S.screen === 'cook') requestWake();
});

render();
loadRecipes();
startLive();
</script>
